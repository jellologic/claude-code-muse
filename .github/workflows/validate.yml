name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    # The scripts use nothing newer than 3.7 (deferred annotations everywhere, and
    # capture_output/text= are the newest calls), but "should work" is not evidence.
    # Run the floor, a mid version and the newest so a deprecation shows up here rather
    # than on a contributor's machine.
    name: offline suite (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # node parses the workflow script in references/workflow.md; without it that check
      # skips silently, which would make a syntax error in the fleet script invisible here.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: Install PyYAML (the frontmatter parse fails under CI=true without it)
        run: python -m pip install pyyaml

      - name: Git identity for the throwaway test repos
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      # No muse calls, no credentials, no cost. The suite stubs the muse binary for the
      # preflight section so the repo guards stay testable on a runner without it.
      - name: Offline suite
        run: bash scripts/validate.sh --offline

      - name: Manifests parse
        run: |
          python3 - <<'PY'
          import json
          for p in [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", "hooks/hooks.json"]:
              json.load(open(p))
              print("ok", p)
          PY

      - name: Hook events are wrapped correctly
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("hooks/hooks.json"))
          # Without the top-level "hooks" key this file parses fine and registers nothing.
          if "hooks" not in d or "SessionStart" not in d["hooks"]:
              sys.exit('hooks.json must wrap events in a top-level "hooks" key')
          print("hooks.json wrapper present")
          PY

      - name: No hardcoded absolute paths
        run: |
          if grep -rn "/Users/\|/home/runner" \
               --include="*.md" --include="*.json" --include="*.py" --include="*.sh" \
               . --exclude-dir=.git; then
            echo "::error::hardcoded absolute path — use \${CLAUDE_PLUGIN_ROOT} instead"
            exit 1
          fi
          echo "no hardcoded absolute paths"

  # The official validator, which had never run here. Both manifests pass today -- which
  # is exactly when to add the guard, before something drifts. The path argument matters:
  # this repo is both a plugin and a single-plugin marketplace, so `validate .` checks
  # marketplace.json and says nothing about plugin.json. Name both.
  manifests:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Both manifests, by path. Validating the PLUGIN manifest also walks every
      # command, agent and skill -- measured; that walk is what caught three commands
      # whose frontmatter did not parse. Naming the component directories separately
      # does not work: a bare directory is treated as a plugin root and refused for
      # having no manifest of its own.
      - name: Validate both manifests
        run: |
          set -euo pipefail
          for target in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            echo "::group::$target"
            claude plugin validate "$target" --strict
            echo "::endgroup::"
          done

      # The local CLI and the runner's can disagree -- 2.1.263 reported "Validation
      # passed" on the same files this step rejected -- so record which one spoke.
      - name: Which validator said that
        if: always()
        run: claude --version

      # A validation step that cannot fail is worth nothing, and this one runs against a
      # tree that is green by construction. Break it on purpose, in a copy, and confirm
      # it goes red -- the same rule the offline suite applies to its own guards.
      - name: The validator can still fail
        run: |
          set -uo pipefail
          cp -r .claude-plugin /tmp/manifest-control
          python3 - <<'PY'
          import json
          p = "/tmp/manifest-control/plugin.json"
          d = json.load(open(p))
          d["thisFieldDoesNotExist"] = True
          json.dump(d, open(p, "w"), indent=2)
          PY
          if claude plugin validate /tmp/manifest-control/plugin.json --strict; then
            echo "::error::--strict accepted an unknown manifest field, so the step above proves nothing"
            exit 1
          fi
          echo "control confirmed: --strict rejects an unknown field"

  # Windows was a known gap (#3). It is green, so this leg is now BLOCKING: the point of
  # measuring it was to be able to keep it. It runs the same free offline suite under Git
  # Bash. Note what it does NOT cover -- muse itself is never invoked here, so live
  # delegation on Windows remains unverified.
  windows:
    name: offline suite (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML (the frontmatter parse fails under CI=true without it)
        shell: bash
        run: python -m pip install pyyaml

      - name: What the environment actually provides
        shell: bash
        run: |
          echo "bash:    $BASH_VERSION"
          echo "python:  $(command -v python || echo MISSING)"
          echo "python3: $(command -v python3 || echo MISSING)"
          echo "git:     $(git --version)"
          echo "mktemp:  $(command -v mktemp || echo MISSING)"
          echo "node:    $(command -v node || echo MISSING)"

      - name: Git identity for the throwaway test repos
        shell: bash
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
          git config --global core.symlinks true

      - name: Offline suite under Git Bash
        shell: bash
        run: bash scripts/validate.sh --offline
