# Manual eval runs: `claude plugin eval` needs credentials, a network, and real
# money, so this never runs on push or pull_request -- only when a human asks.
name: evals

on: workflow_dispatch

permissions:
  contents: read

jobs:
  eval:
    name: claude plugin eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Pinned to the floor in scripts/muse_core.py -- the one place the value
      # lives -- so the evals run against the oldest CLI this plugin supports.
      - name: Install the Claude Code CLI
        run: |
          set -euo pipefail
          v="$(python3 scripts/muse_doctor.py --min-claude-version)"
          case "$v" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::bad MIN_CLAUDE_VERSION '$v'"; exit 1 ;; esac
          npm install -g "@anthropic-ai/claude-code@${v}"

      # --scaffold is required because scaffolds are OFF by default: without it
      # the case runs against an unstaged workspace and every fixture check
      # fails. --trust-plugin skips the interactive trust prompt, which would
      # hang a headless runner. The default with-without ablation stays on on
      # purpose: its delta is the "does the skill earn its tokens" number.
      # The stub muse travels on the operator's PATH (case.yaml env accepts
      # only EVAL_* keys), and the gated tools ride a trailing --allow-tools:
      # the flag is variadic, so it must stay the LAST argument.
      - name: Run the eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PATH="$GITHUB_WORKSPACE/evals/_lib/bin:$PATH" claude plugin eval . --runs 3 --max-cost-usd 5 --threshold 0.8 --json evals-report.json --scaffold --trust-plugin --no-publish --allow-tools Bash Edit Write Workflow

      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evals-report
          path: |
            evals-report.json
            evals/results/
