schema_version: "1.1"
name: bulk-tests-fanout
description: Four untested modules need one pytest file each via supervised fan-out.
tags: [positive]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, Agent, Workflow]
